name: Build NikeBoss Keyboard APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v3
    - name: Decode Keystore
      env:
        ENCODED: ${{ secrets.KEYSTORE_BASE64 }}
      run: echo $ENCODED | base64 -di > app/release.keystore
    - name: Build Debug
      run: chmod +x gradlew && ./gradlew assembleDebug
    - name: Build Release
      run: chmod +x gradlew && ./gradlew assembleRelease
      env:
        RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
        RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    - uses: actions/upload-artifact@v4
      with:
        name: nikeboss-keyboard-debug
        path: app/build/outputs/apk/debug/app-debug.apk
    - uses: actions/upload-artifact@v4
      with:
        name: nikeboss-keyboard-release
        path: app/build/outputs/apk/release/app-release.apk
